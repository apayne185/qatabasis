name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  analyze-cpp:
    # Pinned: ubuntu-latest is rolling over to Ubuntu 26 (from 2026-10-19),
    # so which image a run lands on is not deterministic.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      # Bare-runner build, not the Docker image -- CodeQL's C++ extractor
      # needs to trace compiler invocations directly, which is simpler on
      # the runner than instrumenting a Docker build. No CUDA toolkit here,
      # so CMakeLists.txt's own CUDA auto-detection (see top of that file)
      # takes the CPU-only branch and compiles src/classical/cpu/kernel_stub.cpp
      # instead of the real kernel.cu -- this means the actual CUDA kernel
      # is NOT analyzed by this job. bridge.cpp/dispatcher.cpp/qpu_client.cpp
      # (the pybind11 boundary code, where unsafe pointer/buffer handling
      # risk concentrates) are covered.
      # Python 3.11 comes from actions/setup-python (prebuilt, cached on
      # the runner, ships headers for Development.Module) rather than the
      # deadsnakes PPA: add-apt-repository depends on Launchpad, and a
      # failed apt step (exit 100) turned main red on 2026-11-16 with no
      # code change. CMakeLists.txt hard-pins find_package(Python 3.11 ...),
      # so the exact version still matters -- only its source changed.
      - name: Set up Python 3.11
        id: py311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Retries cover transient mirror hiccups on the remaining
      # Ubuntu-archive packages.
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential cmake \
            libopenmpi-dev openmpi-bin \
            libcurl4-openssl-dev libopenblas-dev \
            libgfortran5 libgomp1

      # Must install into the same interpreter CMake is told to use below --
      # CMakeLists.txt's pybind11_DIR resolution runs
      # `${Python_EXECUTABLE} -c "import pybind11; ..."`.
      - name: Install pybind11 into Python 3.11
        run: ${{ steps.py311.outputs.python-path }} -m pip install pybind11

      - name: Build hpc_core (CPU-only -- no CUDA toolkit on this runner)
        run: |
          mkdir -p build && cd build
          cmake .. -DPython_EXECUTABLE=${{ steps.py311.outputs.python-path }}
          make -j$(nproc)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
