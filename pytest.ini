[pytest]
testpaths = tests
addopts = -v --ignore=tests/test_layers_run.py
markers =
    network: requires outbound network access (PubChem lookups) -- deselect via -m "not network"
    gpu: requires a CUDA GPU (AerSimulator device="GPU") -- deselect via -m "not gpu"

# test_layers_run.py is excluded from collection: it's an MPI-orchestrated
# integration test (mpirun -np N python3 tests/test_layers_run.py), not a
# plain-process pytest module. Run it via `make trial` instead.
