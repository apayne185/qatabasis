name: hybrid-vqe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pybind11
  - cmake
  - numpy
  - scipy
  - matplotlib
  - mpi4py
  - mpich
  - pytest
  # Pin UCX <1.20 - 1.20.0 ships with libuct referencing an unexported
  # ucs_netif_is_ipoib symbol, breaking the mpi4py import chain.
  - ucx<1.20
  - gcc_linux-64=13.*
  - gxx_linux-64=13.*
  - pip
  - pip:
      # qiskit>=1.0,<2.0 pin below was stale -- Dockerfile's pip path
      # (verified 2026-09-22) resolves to qiskit==2.5.2 today, matching
      # requirements.txt's >=2.5.2,<3.0, not this file's old <2.0 ceiling.
      # Widened to match what's actually installable and verified working.
      - qiskit>=2.5.2,<3.0
      # This installs a CPU-only wheel first; scripts/install_native.sh
      # force-reinstalls qiskit-aer==0.17.2 from source (CUDA-enabled)
      # right after the CMake build step, once nvcc is confirmed present.
      - qiskit-aer>=0.14.0
      # qiskit-aer-gpu (separate package) no longer exists on PyPI --
      # confirmed via `pip index versions qiskit-aer-gpu` returning no
      # distribution, 2026-09-22. GPU support now comes from building
      # plain qiskit-aer with AER_THRUST_BACKEND=CUDA (see Dockerfile),
      # not from a separate -gpu package. This line would make `conda env
      # create` fail outright; removed rather than left broken.
      - qiskit-algorithms>=0.3.0
      - qiskit-nature>=0.7
      - qiskit-ibm-runtime>=0.20
      - pyscf>=2.4
      - pylatexenc
      - cupy-cuda12x; platform_system == "Linux"
      - rdkit
      # pinned to known-working CUDA combo (June 2026 RTX 6000 Ada validation)
      - nvidia-cublas-cu12==12.9.2.10
      - nvidia-cuda-runtime-cu12==12.9.79
      - nvidia-cuda-nvrtc-cu12==12.9.86
      - nvidia-cusparse-cu12==12.5.10.65
      - nvidia-cusolver-cu12==11.7.5.82
      - nvidia-nvjitlink-cu12==12.9.86
